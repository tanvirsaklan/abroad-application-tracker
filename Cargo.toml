[package]
name = "application_tracker"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Desktop tracker app for professor outreach emails and application deadlines (Dioxus + SQLite)"
publish = false

[dependencies]
chrono = "0.4"
csv = "1.3"
directories = "6"
dioxus = { version = "0.7", features = ["desktop"] }
image = { version = "0.25", default-features = false, features = ["ico"] }
rusqlite = { version = "0.42", features = ["bundled"] }
strsim = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["time"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
